name: Feature request
description: Something the plugin should do and does not
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: Describe the reading or library problem, not the solution.
    validations:
      required: true

  - type: textarea
    id: idea
    attributes:
      label: What you have in mind
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
    validations:
      required: false
