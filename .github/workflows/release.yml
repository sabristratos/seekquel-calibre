name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Check the tag matches the version in the plugin
        run: |
          tag="${GITHUB_REF_NAME#v}"
          declared=$(grep -oP "^__version__ = '\K[^']+" seekquel_sync/__init__.py)
          if [ "$tag" != "$declared" ]; then
            echo "Tag $tag does not match __version__ $declared in seekquel_sync/__init__.py"
            exit 1
          fi

      - name: Build the plugin
        run: python build.py

      # The name carries no version on purpose: it is what makes
      # https://github.com/OWNER/REPO/releases/latest/download/seekquel-sync.zip
      # a permanent direct download, which is the link the app's connect panel
      # hands the reader. A versioned asset can only be linked through the
      # release page, leaving them to find the file themselves.
      - name: Name the archive
        run: mv "dist/Seekquel Sync.zip" "seekquel-sync.zip"

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          files: seekquel-sync.zip
          generate_release_notes: true
