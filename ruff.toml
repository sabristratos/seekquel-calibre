target-version = "py38"
builtins = ["get_icons", "get_resources"]
line-length = 110

[lint]
select = [
    "F",
    "E",
    "W",
    "I",
    "UP",
    "B",
    "C4",
    "SIM",
    "RET",
    "ARG",
    "PTH",
    "RUF",
]

ignore = [
    "BLE001",
    "RUF012",
]

[lint.per-file-ignores]
"seekquel_sync/*.py" = ["PLC0415"]
